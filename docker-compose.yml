# version: "3.8"

services:
  # API GATEWAY
  api-gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      # Host port is configurable: rootless Docker cannot bind ports below 1024.
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      - frontend
      - identity-service
      - notifications-service
      - exam-service
      - session-manager-service
      - grading-service
    networks:
      - default

  # FRONTEND (static bundle served by nginx, proxied by the gateway)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: on-failure
    networks:
      - default

  #KAFKA INFRAESTRUCTURE:ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  #KAFKA
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka_data:/var/lib/kafka/data

  # REDIS
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
      # Alternativa más explícita:
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379
      # - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - debug
  # MONGO DB
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/mongodb:/data/db:Z
  #MiniO
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/minio:/data:Z

  #IDENTITY SERVICE (auth + user/candidate/role management — merged 2026-09)
  identity-service:
    build:
      context: ./identity-service
      dockerfile: dockerfile
    container_name: identity-service
    # ports:
    #   - "${IDENTITY_SERVICE_PORT}:3002"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3002
      - TZ=America/La_Paz
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017
      - MONGO_DB_NAME=${MONGO_USERS_DB_NAME:-cba_identity_db}
      - MONGO_COLLECTION_USERS=users
      - MONGO_COLLECTION_CANDIDATES=candidates
      - MONGO_COLLECTION_ROLES=roles
      - MONGO_COLLECTION_SESSIONS=sessions
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_CACHE_PREFIX="usermgmt:cache"
      - REDIS_SESSION_PREFIX="usermgmt:session"
      - AUTH_REDIS_SESSION_PREFIX="auth:session"
      - AUTH_REDIS_BLACKLIST_PREFIX="auth:blacklist"
      - KAFKA_CLIENT_ID=identity-service
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC_USER_EVENTS=user-events
      - KAFKA_TOPIC_CANDIDATE_EVENTS=candidate-events
      - KAFKA_TOPIC_OTP_EVENTS=otp-events
      - KAFKA_TOPIC_SECURITY_EVENTS=security-events
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRATION}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRES_IN=7d
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - OTP_LOGIN_REQUIRED=${OTP_LOGIN_REQUIRED:-true}
      - UPLOAD_MAX_SIZE=10485760
      - UPLOAD_ALLOWED_TYPES="image/jpeg,image/png,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv"
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=info
      - MAX_IMPORT_RECORDS=1000
      - EXCEL_SHEET_NAME=Candidates
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_PUBLIC_URL=http://localhost:9000
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3002/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  #NOTIFICATION SERVICE
  notifications-service:
    build:
      context: .
      dockerfile: notifications-service/dockerfile
    container_name: notification-service
    # ports:
    #   - "${NOTIFICATION_SERVICE_PORT}:3001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017
      - MONGO_DB_NAME=${MONGO_NOTIFICATION_DB_NAME}
      - MONGO_COLLECTION_EMAILS=${MONGO_COLLECTION_EMAILS}
      - MONGO_COLLECTION_TEMPLATES=email_templates
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_CACHE_PREFIX="notifications:cache"
      - REDIS_QUEUE_PREFIX="notifications:queue"
      - KAFKA_CLIENT_ID=notifications-service
      - KAFKA_BROKER=kafka:29092
      - KAFKA_GROUP_ID=notifications-group
      - KAFKA_TOPICS_USER_EVENTS=user-events
      - KAFKA_TOPICS_OTP_EVENTS=otp-events
      - KAFKA_TOPICS_EMAIL_EVENTS=email-events
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=noreply@oliviodev.com
      - RESEND_FROM_NAME=CBA Tarija Platform
      - EMAIL_RETRY_ATTEMPTS=3
      - EMAIL_RETRY_DELAY=5000
      - EMAIL_BATCH_SIZE=50
      - USER_MANAGEMENT_SERVICE_URL=http://identity-service:3002
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  exam-service:
    build:
      context: .
      dockerfile: exam-service/dockerfile
    container_name: exam-service
    # ports:
    #   - "${EXAM_SERVICE_PORT:-3003}:3003"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3003
      - TZ=America/La_Paz
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_EXAM_DB_NAME:-cba_platform}?authSource=admin
      - MONGO_DB_NAME=${MONGO_EXAM_DB_NAME:-cba_platform}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_CLIENT_ID=exam-service
      - KAFKA_BROKER=kafka:29092
      - KAFKA_GROUP_ID=exam-service
      - KAFKA_TOPIC_EXAM_EVENTS=exam-events
      - KAFKA_TOPIC_SESSION_EVENTS=session-events
      - AUTH_SERVICE_URL=http://identity-service:3002
      - USER_MANAGEMENT_SERVICE_URL=http://identity-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3001/notifications
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_MANAGER_SERVICE_URL=http://session-manager-service:3004
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=exam-files
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=info
      - GRADING_SERVICE_URL=http://grading-service:3007
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MONGO_UMS_DB_NAME=${MONGO_USERS_DB_NAME:-cba_identity_db}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      grading-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3003/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # SESSION MANAGER SERVICE - NUEVO
  session-manager-service:
    build:
      context: ./session-manager-service
      dockerfile: dockerfile
    container_name: session-manager-service
    # ports:
    #   - "${SESSION_MANAGER_PORT:-3004}:3004"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3004
      - TZ=America/La_Paz
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_EXAM_DB_NAME:-cba_platform}?authSource=admin
      - MONGO_DB_NAME=${MONGO_EXAM_DB_NAME:-cba_platform}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_CLIENT_ID=session-manager-service
      - KAFKA_BROKER=kafka:29092
      - KAFKA_GROUP_ID=session-manager-group
      - KAFKA_TOPIC_SESSION_EVENTS=session-events
      - KAFKA_TOPIC_EXAM_EVENTS=exam-events
      - KAFKA_TOPIC_NOTIFICATION_EVENTS=notification-events
      - AUTH_SERVICE_URL=http://identity-service:3002
      - EXAM_SERVICE_URL=http://exam-service:3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3001
      - USER_MANAGEMENT_SERVICE_URL=http://identity-service:3002
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=info
      - WEBSOCKET_PING_TIMEOUT=60000
      - WEBSOCKET_PING_INTERVAL=25000
      - FRONTEND_URL=${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3004/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  #KAFKA_UI - Solo para debugging
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - debug
  bull-dashboard:
    build:
      context: ./docker/bull-dashboard
    container_name: bull-dashboard
    ports:
      - "3005:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    profiles:
      - debug
  # GRADING SERVICE (REST API - GROQ AI)
  grading-service:
    build:
      context: .
      dockerfile: mcp-grading-server/dockerfile
    container_name: grading-service
    # ports:
    #   - "3007:3007"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3007
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_EXAM_DB_NAME:-cba_platform}?authSource=admin
      - MONGO_DB_NAME=${MONGO_EXAM_DB_NAME:-cba_platform}
      - MONGO_CANDIDATES_DB_NAME=${MONGO_USERS_DB_NAME:-cba_identity_db}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - NOTIFICATION_SERVICE_URL=http://notification-service:3001
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MINIO_BUCKET_NAME=exam-files
      - CORS_ORIGIN=${CORS_ORIGIN}
      - KAFKA_BROKER=kafka:29092
      - GRADING_SWEEP_INTERVAL_MS=${GRADING_SWEEP_INTERVAL_MS:-120000}
      - GRADING_SWEEP_MIN_AGE_MS=${GRADING_SWEEP_MIN_AGE_MS:-180000}
      - GRADING_SWEEP_MAX_AGE_MS=${GRADING_SWEEP_MAX_AGE_MS:-604800000}
      - GRADING_SWEEP_BATCH=${GRADING_SWEEP_BATCH:-20}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3007/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  mongo_data:
    driver: local
  zookeeper_data:
    driver: local
  minio_data:
    driver: local
  minio_multimedia:
    driver: local

networks:
  default:
    driver: bridge
