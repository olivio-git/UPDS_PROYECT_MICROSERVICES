# exams.cba.org.bo — CBA exam platform.
#
# Host nginx site. Install as /etc/nginx/sites-available/exams and symlink it
# into sites-enabled (the server's convention). TLS ends here; the Docker
# stack's gateway listens on 127.0.0.1:8088 (docker-compose.prod.yml).
# The certificate must exist before this file is enabled: see docs/deploy-cba.md.

# Socket.IO upgrades to WebSocket; plain requests must keep "close" semantics.
# Named for this site so it cannot collide with a map in another site file.
map $http_upgrade $exams_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name exams.cba.org.bo;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name exams.cba.org.bo;

    ssl_certificate /etc/letsencrypt/live/exams.cba.org.bo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exams.cba.org.bo/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Audio answers and question media go up to 50 MB (same limit as the gateway).
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $exams_connection_upgrade;

        # Services accept a browser origin only when it matches the host the
        # request came in through, so the public host must reach them.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grading an exam with the AI can take a while; WebSockets stay open.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
